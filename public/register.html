<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký tài khoản – SânNhanh</title>
  <meta name="description" content="Tạo tài khoản SânNhanh để đặt sân bóng mini, pass sân, ghép kèo và nhờ sân báo giá.">
  <meta name="robots" content="noindex,follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SânNhanh">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="Đăng ký tài khoản – SânNhanh">
  <meta property="og:description" content="Tạo tài khoản SânNhanh để đặt sân bóng mini, pass sân, ghép kèo và nhờ sân báo giá.">
  <meta property="og:url" content="https://sannhanh.pages.dev/register.html">
  <meta property="og:image" content="https://sannhanh.pages.dev/img/photos/venue2-900.jpg">
  <meta property="og:image:width" content="900">
  <meta property="og:image:height" content="600">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/img/favicon.svg">
  <link rel="preload" href="/fonts/Archivo-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-auth">
  <div id="app-header"></div>
  <main class="auth">
    <div class="auth-visual" aria-hidden="true">
      <img src="/img/photos/venue2-900.jpg" width="900" height="600" alt="">
      <p class="display">Đặt sân<br>cho cả đội</p>
    </div>
    <section class="auth-panel" aria-labelledby="auth-title">
      <p class="eyebrow">Khách hàng</p>
      <h1 class="h1" id="auth-title">Tạo tài khoản</h1>
      <form id="auth-form" data-mode="register" novalidate>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="field"><label for="fullName">Họ tên</label><input class="input" id="fullName" name="fullName" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="phone">Số điện thoại</label><input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required><span class="hint">10 chữ số, bắt đầu bằng 0. Chủ sân dùng số này để liên hệ khi cần.</span></div>
        <div class="field"><label for="password">Mật khẩu</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required><span class="hint">Ít nhất 8 ký tự.</span></div>
        <button class="btn btn-dark btn-lg btn-block" type="submit">Đăng ký</button>
      </form>
      <p class="auth-alt">Đã có tài khoản? <a href="/login.html" id="alt-link">Đăng nhập</a></p>
    </section>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="/js/auth-page.js"></script>
</body>
</html>
