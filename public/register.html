<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký – SânNhanh</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
<main class="container">
  <div class="card auth-card">
    <h1>Đăng ký tài khoản</h1>
    <div id="form-error" class="alert alert-error hidden"></div>
    <form id="register-form" class="stack" novalidate>
      <div><label for="fullName">Họ tên *</label><input id="fullName" name="fullName" autocomplete="name" required minlength="2" maxlength="100"></div>
      <div><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div><label for="phone">Số điện thoại *</label><input id="phone" name="phone" type="tel" autocomplete="tel" required pattern="0[0-9]{9}" placeholder="0901234567"></div>
      <div><label for="password">Mật khẩu *</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"><div class="field-hint">Tối thiểu 8 ký tự</div></div>
      <div><label for="password2">Nhập lại mật khẩu *</label><input id="password2" name="password2" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-block" type="submit">Đăng ký</button>
    </form>
    <p class="small muted">Đã có tài khoản? <a href="/login.html" id="login-link">Đăng nhập</a></p>
  </div>
</main>
</body>
</html>
