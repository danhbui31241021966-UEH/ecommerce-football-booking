<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – GGO</title>
  <meta name="description" content="Đăng nhập GGO để đặt sân bóng mini.">
  <meta name="robots" content="noindex,follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GGO">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="Đăng nhập – GGO">
  <meta property="og:description" content="Đăng nhập GGO để đặt sân bóng mini, xem lịch đặt của tôi, pass sân và ghép kèo.">
  <meta property="og:url" content="https://ggo-datsan.pages.dev/login.html">
  <meta property="og:image" content="https://ggo-datsan.pages.dev/img/og-ggo.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/img/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/Archivo-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-auth">
  <div id="app-header"></div>
  <main class="auth">
    <div class="auth-visual" aria-hidden="true">
      <img src="/img/photos/venue2-900.jpg" width="900" height="600" alt="">
      <p class="display">Vào sân<br>nhanh hơn</p>
    </div>
    <section class="auth-panel" aria-labelledby="auth-title">
      <h1 class="h1" id="auth-title">Đăng nhập</h1>
      <p id="booking-context" class="auth-booking-context" hidden></p>
      <form id="auth-form" data-mode="login" novalidate>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="field"><label for="identifier">Số điện thoại hoặc email</label><input class="input" id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
        <div class="field"><label for="password">Mật khẩu</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-dark btn-lg btn-block" type="submit">Đăng nhập</button>
      </form>
      <p class="auth-alt">Khách mới? <a href="/register.html" id="alt-link">Tạo tài khoản</a>. Tài khoản chủ sân do admin cấp.</p>
      <div class="demo-accounts" id="demo-accounts" role="group" aria-label="Đăng nhập nhanh bằng tài khoản demo" hidden>
        <span>Tài khoản demo, mật khẩu <code>Matkhau@123</code></span>
        <button type="button" data-identifier="khach1@datsan.local">Khách hàng</button>
        <button type="button" data-identifier="chusan1@datsan.local">Chủ sân</button>
        <button type="button" data-identifier="admin@datsan.local">Admin</button>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="/js/auth-page.js"></script>
</body>
</html>
