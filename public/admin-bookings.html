<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lịch đặt · GGO</title><link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/admin.css"><script type="module" src="/js/admin/bookings.js"></script></head><body><div id="app-header"></div><main class="container admin-page"><header class="admin-heading"><p class="eyebrow">QUẢN TRỊ HỆ THỐNG / 02</p><h1 class="h1">Lịch đặt</h1><p>Tìm lịch đặt của mọi sân và xử lý các trường hợp đặc biệt.</p></header><section class="admin-tools"><label class="search-field">Tìm lịch đặt<input id="booking-search" type="search" placeholder="Mã đặt sân, tên sân hoặc tên khách"></label><label>Trạng thái<select id="booking-status"><option value="">Tất cả trạng thái</option><option value="pending">Chờ chủ sân đồng ý</option><option value="confirmed">Đã có sân</option><option value="rejected">Chủ sân từ chối</option><option value="cancelled">Đã hủy</option><option value="expired">Quá hạn</option><option value="completed">Đã đá</option><option value="no_show">Bùng sân</option><option value="transferred">Đã pass</option><option value="matching">Đang tìm đội đá cùng</option></select></label><button id="booking-filter" class="btn btn-lime">Lọc kết quả</button></section><p class="admin-feedback" id="feedback" role="status"></p><section class="data-panel"><div class="panel-heading"><h2>Kết quả tra cứu</h2><span id="booking-count"></span></div><div id="booking-list" class="responsive-list" aria-live="polite"></div></section></main><div id="app-footer"></div></body></html>
