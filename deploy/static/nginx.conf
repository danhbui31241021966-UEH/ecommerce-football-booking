# Bản tĩnh chế độ dữ liệu mẫu, đáp giống Cloudflare Pages (so bằng scripts/compare-status.mjs):
#   /x phục vụ x.html; /x.html và /x/ -> 308 /x; /index, /index.html -> 308 /; link cũ -> 301 (bảng redirects.conf sinh từ src/static-site.js);
#   đường dẫn lạ -> 404 với trang 404. TLS do Traefik đảm nhận, container chỉ nghe HTTP 8080.
map $uri $ggo_cache {
  ~^/(images|fonts)/  "public, max-age=86400";
  default             "public, max-age=0, must-revalidate";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header Cache-Control $ggo_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # CSP, X-Frame-Options, HSTS: sinh từ SECURITY_HEADERS trong src/static-site.js (cùng giá trị với _headers của Pages).
  include /etc/nginx/ggo/headers.conf;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  error_page 404 /__not-found;
  location = /__not-found { internal; try_files /404.html =404; }

  include /etc/nginx/ggo/redirects.conf;

  location = / { try_files /index.html =404; }
  location = /index { return 308 /$is_args$args; }
  location = /index.html { return 308 /$is_args$args; }
  location = /_redirects { return 404; }

  location ~ ^/(?<page>[^/]+)\.html$ {
    if (-f $document_root/$page.html) { return 308 /$page$is_args$args; }
    return 404;
  }
  location ~ ^/(?<page>[^/]+)/$ {
    if (-f $document_root/$page.html) { return 308 /$page$is_args$args; }
    return 404;
  }

  location / { try_files $uri $uri.html =404; }
}
