<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tìm sân bóng đá mini 5 người, 7 người ở TP.HCM – GGO</title>
  <meta name="description" content="Lọc sân bóng mini theo ngày, giờ đá, quận, loại sân 5 hoặc 7 người và giá. Giờ còn trống hiện ngay trên từng sân ở Quận 7, Gò Vấp, Thủ Đức và nhiều quận khác.">
  <link rel="canonical" href="https://ggo-datsan.pages.dev/products.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GGO">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="Tìm sân bóng đá mini 5 người, 7 người ở TP.HCM – GGO">
  <meta property="og:description" content="Lọc sân bóng mini theo ngày, giờ đá, quận, loại sân 5 hoặc 7 người và giá. Giờ còn trống hiện ngay trên từng sân ở Quận 7, Gò Vấp, Thủ Đức và nhiều quận khác.">
  <meta property="og:url" content="https://ggo-datsan.pages.dev/products.html">
  <meta property="og:image" content="https://ggo-datsan.pages.dev/img/og-ggo.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/images/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/images/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/images/favicon-16.png?v=2" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=2">
  <link rel="preload" href="/fonts/Archivo-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <div class="page-head">
        <p class="crumb"><a href="/">Trang chủ</a> / Tìm sân</p>
        <h1 class="h1">Tìm sân trống</h1>
        <p class="sub" id="summary" aria-live="polite">Đang tải…</p>
      </div>

      <div class="filter-summary">
        <button type="button" class="filter-toggle" id="f-toggle" aria-expanded="false" aria-controls="filters">
          <span class="filter-now" id="f-now">Đang tải…</span><span class="filter-change" id="f-change">Đổi</span>
        </button>
      </div>

      <form class="filter-bar" id="filters" aria-label="Bộ lọc sân" hidden>
        <div class="filter-grid">
          <div class="filter-field"><label class="filter-label" for="f-name">Tên sân</label><input class="input" id="f-name" type="search" placeholder="Nhập tên sân" autocomplete="off"></div>
          <div class="filter-field"><label class="filter-label" for="f-sort">Sắp xếp giá</label><select class="select" id="f-sort"><option value="">Ưu tiên giờ có thể đặt</option><option value="asc">Giá thấp đến cao</option><option value="desc">Giá cao đến thấp</option></select></div>
        </div>
        <div class="filter-row">
          <span class="filter-label">Ngày</span>
          <div class="day-chips" id="f-days" role="group" aria-label="Chọn ngày"></div>
        </div>
        <div class="filter-grid">
          <div class="filter-field"><label class="filter-label" for="f-at">Giờ đá</label>
            <select class="select" id="f-at"></select></div>
          <div class="filter-field"><label class="filter-label" for="f-district">Quận</label>
            <select class="select" id="f-district"><option value="">Tất cả quận</option></select></div>
          <div class="filter-field type"><span class="filter-label" id="f-type-label">Loại sân</span>
            <div class="segmented" id="f-type" role="group" aria-labelledby="f-type-label">
              <button type="button" data-v="" aria-pressed="true">Tất cả</button>
              <button type="button" data-v="5" aria-pressed="false">Sân 5</button>
              <button type="button" data-v="7" aria-pressed="false">Sân 7</button>
            </div></div>
        </div>
        <div class="filter-row">
          <span class="filter-label">Giá</span>
          <div class="chips" id="f-price" role="group" aria-label="Mức giá">
            <button type="button" class="chip" data-v="" aria-pressed="true">Mọi mức giá</button>
            <button type="button" class="chip" data-v="300000" aria-pressed="false">Đến 300k</button>
            <button type="button" class="chip" data-v="400000" aria-pressed="false">Đến 400k</button>
            <button type="button" class="chip" data-v="500000" aria-pressed="false">Đến 500k</button>
          </div>
          <button type="button" class="chip" id="f-last" aria-pressed="false">Đang giảm giá giờ chót</button>
        </div>
      </form>

      <div class="card-grid" id="results" aria-live="polite"></div>
      <div id="req-cta"></div>
      <div class="card empty" id="empty" hidden>
        <div class="art" data-icon="calendar"></div>
        <p><b style="color:var(--text)">Không có sân phù hợp</b><br><span id="empty-why">Thử đổi ngày, bỏ bớt bộ lọc hoặc chọn giờ khác.</span></p>
        <button type="button" class="btn btn-lime" id="clear-filters">Xóa bộ lọc</button>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="/js/venues.js"></script>
</body>
</html>
